name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "repo.json"
      - ".github/**"

jobs:
  Derle:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: "Kaynak dalını çek"
        uses: actions/checkout@v4
        with:
          path: src

      - name: "'builds' dalını çek"
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: "JDK 17 kur"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: "Android SDK kur"
        uses: android-actions/setup-android@v3

      - name: "Eklentileri derle"
        run: |
          cd "${GITHUB_WORKSPACE}/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: "Çıktıları 'builds' dalına taşı"
        run: |
          rm -f "${GITHUB_WORKSPACE}/builds"/*.cs3
          find "${GITHUB_WORKSPACE}/src" -name "*.cs3" -exec cp {} "${GITHUB_WORKSPACE}/builds/" \;
          cp "${GITHUB_WORKSPACE}/src/build/plugins.json" "${GITHUB_WORKSPACE}/builds/"
          ls -la "${GITHUB_WORKSPACE}/builds"

      - name: "Derlemeleri yükle"
        run: |
          cd "${GITHUB_WORKSPACE}/builds"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "değişiklik yok, atlanıyor"
            exit 0
          fi

          # ! tek commit olarak tutuluyor — her derlemede .cs3 birikip depoyu şişirmesin
          if git rev-parse HEAD >/dev/null 2>&1; then
            git commit --amend -m "${GITHUB_SHA} derlemesi"
          else
            git commit -m "${GITHUB_SHA} derlemesi"
          fi

          git push --force
